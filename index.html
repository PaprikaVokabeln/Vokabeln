<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Vokabeltrainer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="btn-back" class="back" hidden aria-label="Zurück">←</button>
    <h1 id="title">Vokabeltrainer</h1>
  </header>

  <main id="app"></main>

  <dialog id="dlg">
    <form id="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-fields"></div>
      <div class="row">
        <button type="button" class="btn secondary" id="dlg-cancel">Abbrechen</button>
        <button type="submit" class="btn primary">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Fehler-Anzeiger: zeigt Probleme direkt auf dem Bildschirm -->
  <script>
    function zeigeFehler(text) {
      document.getElementById('app').innerHTML =
        '<div class="tile" style="color:#dc2626"><b>Fehler:</b><br>' + text + '</div>';
    }
    window.addEventListener('error', e => {
      const datei = (e.filename || '').split('/').pop();
      zeigeFehler(e.message + '<br>Datei: ' + datei + ', Zeile ' + e.lineno);
    });
    window.addEventListener('unhandledrejection', e => zeigeFehler(String(e.reason)));
  </script>

  <!-- Die App selbst: Reihenfolge ist wichtig! Erst db.js, dann app.js -->
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
